version: 2
updates:
  # Frontend dependencies (the lockfile in frontend/)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  # API and test project NuGet packages
  - package-ecosystem: nuget
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: nuget
    directory: /api.tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  # The versions of the actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  # Base images in the two Dockerfiles
  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 2