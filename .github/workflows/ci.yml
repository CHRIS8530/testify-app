name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check formatting
        run: dotnet format api/Testify.Api.csproj --verify-no-changes

      - name: Run tests
        run: dotnet test api.tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install web dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install the Playwright browser
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Build the API
        run: dotnet build api/Testify.Api.csproj --configuration Release

      - name: Run the browser tests
        env:
          ASPNETCORE_ENVIRONMENT: Test
          ASPNETCORE_URLS: http://localhost:5137
          # Made up for this job only. The API uses an in memory database, so there is nothing real to protect.
          JWT_SECRET: e2e-only-secret-key-not-used-anywhere-else-1234567890
          CORS_ALLOWED_ORIGINS: http://localhost:5173
          RATE_LIMIT_PER_MINUTE: '100000'
        run: |
          dotnet run --project api --configuration Release --no-build --no-launch-profile > api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:5137/api/v1/health; then
              echo "The API is up"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "The API did not start"
              cat api.log
              exit 1
            fi
            sleep 2
          done
          cd frontend
          npx playwright test

      - name: Show the API log
        if: failure()
        run: cat api.log || true

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check the compose file
        run: docker compose config --quiet

      - name: Build the API image
        run: docker compose build api

      - name: Start the database and the API
        run: docker compose up -d postgres api

      - name: Wait for the API to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/api/v1/health > /dev/null; then
              echo "The API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "The API did not become healthy"
          exit 1

      - name: Check that the API allows the web app origin
        run: |
          curl -si -X OPTIONS http://localhost:5000/api/v1/projects \
            -H "Origin: http://localhost:3000" \
            -H "Access-Control-Request-Method: GET" \
            | grep -i "access-control-allow-origin: http://localhost:3000"

      - name: Build the web app image
        run: docker compose build frontend

      - name: Check that the web app image is production shaped
        run: |
          user=$(docker run --rm --entrypoint id testify-app-frontend -u)
          echo "The web app image runs as user id $user"
          if [ "$user" = "0" ]; then echo "The web app image runs as root"; exit 1; fi
          if docker run --rm --entrypoint sh testify-app-frontend -c 'command -v node' > /dev/null; then
            echo "The web app image still contains Node"
            exit 1
          fi
      - name: Start the web app
        run: docker compose up -d frontend

      - name: Check that the web app is served
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ > /tmp/index.html; then break; fi
            sleep 2
          done
          grep -q '<div id="root">' /tmp/index.html

      - name: Check that a client side route falls back to the page
        run: |
          code=$(curl -s -o /tmp/route.html -w "%{http_code}" http://localhost:3000/projects/abc)
          echo "GET /projects/abc answered $code"
          [ "$code" = "200" ]
          grep -q '<div id="root">' /tmp/route.html

      - name: Check that the API address is baked into the bundle
        run: |
          js=$(grep -o '/assets/[^"]*\.js' /tmp/index.html | head -1)
          echo "The bundle is $js"
          curl -fsS "http://localhost:3000$js" | grep -q "http://localhost:5000"
      - name: Check that the web app proxies the API
        run: |
          body=$(curl -fsS http://localhost:3000/api/v1/health)
          echo "GET /api/v1/health through the web app answered: $body"
          echo "$body" | grep -q '"status":"healthy"'
      - name: Show the image sizes
        run: docker image ls --format "{{.Repository}} {{.Tag}} {{.Size}}"

      - name: Show the API log
        if: failure()
        run: docker compose logs api

      - name: Stop everything
        if: always()
        run: docker compose down -v
